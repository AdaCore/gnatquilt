<div class="xcov-navigation">
  <a [routerLink]="['/report']">⇪ Back to sources list</a>
</div>
<div class="xcov-report-content">
  <ng-container *ngIf="source$ | async as source">
    <h2 class="xcov-section-title" id=":c">❯ {{ source.filename }}</h2>
    <app-enumerable-table
      [ctx]="ctx$ | async"
      [project]="source.getScopeMetrics()"
      [isSource]="false"
      (clickedOnEnumerable)="clickedOnEnumerable($event, scroll)"
    ></app-enumerable-table>
    <table class="xcov-source">
      <div class="xcov-source-toolbar">
        <mat-checkbox
          class="example-margin"
          [(ngModel)]="expandCollapseService.autoCollapse"
        >
          Auto Collapse
        </mat-checkbox>
      </div>
      <virtual-scroller
        id="scroll"
        #scroll
        [items]="source.mappings"
        [parentScroll]="scroll.window"
        [childHeight]="20"
        [bufferAmount]="20"
        [enableUnequalChildrenSizes]="true"
      >
        <tbody #container class="xcov-source-content">
          <ng-container *ngFor="let mapping of scroll.viewPortItems">
            <tr
              class="{{ getClass(mapping) }} xcov-source-line"
              app-source-line
              [mapping]="mapping"
              [language]="source.language"
            ></tr>
          </ng-container>
        </tbody>
      </virtual-scroller>
    </table>
  </ng-container>
</div>
