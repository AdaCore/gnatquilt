<div class="xcov-source-line-message">
  <table class="xcov-source-line-attached">
    <tbody></tbody>
    <tr class="xcov-source-line-attached-row">
      <td class="xcov-source-line-attached-message-label">
        {{ message.kind }}
      </td>
      <td>
        <div class="xcov-source-line-attached-message-body">
          <ng-container *ngIf="hasSco() && (sco$ | async) as sco">
            <span
              class="xcov-source-line-attached-sco"
              (click)="showText()"
              matTooltip="Select Text"
              >{{ sco.kind }} {{ sco.text }} at {{ strLowOrUp(sco.range, 0) }}
            </span>
          </ng-container>
          {{ message.message }}
        </div>
        <ng-container *ngIf="hasSco() && (sco$ | async) as sco">
          <ng-container *ngFor="let annotation of sco.annotations">
            <div>note: {{ annotation }}</div>
          </ng-container>
        </ng-container>
      </td>
    </tr>
  </table>
</div>
