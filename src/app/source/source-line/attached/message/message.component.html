<div  class="xcov-source-line-message">
    <table class="xcov-source-line-attached">
        <tbody></tbody>
        <tr class="xcov-source-line-attached-row">
            <td class="xcov-source-line-attached-message-label">
                {{message.kind}}
            </td>
            <td> <div class="xcov-source-line-attached-message-body">
                <ng-container *ngIf="hasSco() && (sco$ | async) as sco">
                <span class="xcov-source-line-attached-sco">{{sco.kind}} "{{sco.text}}" at {{strLowOrUp(sco.range, 0)}}
                </span>
                </ng-container>
                <span>{{message.message}}</span>
            </div>
            </td>
        </tr>
    </table>
</div>
