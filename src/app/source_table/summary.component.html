<table class="xcov-summary">
  <tbody>
  <tr>
    <td *ngFor="let status of ctx.properties "
        class="xcov-summary{{statusProperties[status].classSuffix}}"
        width="{{enumerable.statsPercent[status]}}%"
        matTooltip="{{enumerable.statsPercent[status]}}% {{statusProperties[status].name}}"
    ></td>
  </tr>
  </tbody>
</table>
